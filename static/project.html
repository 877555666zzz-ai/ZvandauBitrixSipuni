<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoCall · Проект</title><style>
body{font-family:Inter,Arial,sans-serif;background:#f5f6f8;margin:0;color:#17191c}.wrap{max-width:1200px;margin:30px auto;padding:20px}.top{display:flex;align-items:center;gap:16px}.back{text-decoration:none;color:#6d28d9}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee}.on{color:#059669}.off{color:#9ca3af}.pill{padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="/">← Все проекты</a><div><h1 id="title">Проект</h1><div id="meta" class="muted"></div></div></div><div class="grid"><section class="card full"><h2>Сотрудники</h2><table><thead><tr><th>Имя</th><th>Внутренний Kcell</th><th>Статус</th><th>Принято</th></tr></thead><tbody id="mgr"></tbody></table></section><section class="card"><h2>Очередь автодозвона</h2><div id="queue"></div></section><section class="card"><h2>Последние звонки</h2><div id="logs"></div></section></div></div><script>
const id=location.pathname.split('/').pop();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [ds,ms,ls]=await Promise.all([fetch('/departments').then(r=>r.json()),fetch('/managers?department_id='+id).then(r=>r.json()),fetch('/logs?limit=50&department_id='+id).then(r=>r.json())]);const d=ds.find(x=>String(x.id)===String(id));if(!d){document.body.innerHTML='Проект не найден';return}title.textContent=d.name;meta.textContent=`Bitrix CATEGORY_ID ${d.deal_category_id} · стадия ${d.stage_trigger}`;mgr.innerHTML=ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.sipnumber)}</td><td class="${m.online?'on':'off'}">${esc(m.status)}</td><td>${m.accepted_calls}</td></tr>`).join('');queue.innerHTML=(ls.autodial_queue||[]).map(q=>`<p><b>#${q.lead_id}</b> ${esc(q.lead_name||q.phone)} <span class="pill">${esc(q.state)}</span></p>`).join('')||'<span class="muted">Очередь пуста</span>';logs.innerHTML=(ls.logs||[]).slice(0,15).map(l=>`<p><b>${esc(l.manager_name||'—')}</b> · ${esc(l.status)} · ${esc(l.phone)}</p>`).join('')||'<span class="muted">Нет звонков</span>';}load();setInterval(load,15000);
</script></body></html>
