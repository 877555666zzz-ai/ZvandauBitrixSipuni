<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoCall · Проекты</title><style>
body{font-family:Inter,Arial,sans-serif;background:#f5f6f8;margin:0;color:#17191c}.wrap{max-width:1000px;margin:60px auto;padding:24px}h1{font-size:32px}.sub{color:#68707a;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;text-decoration:none;color:inherit;box-shadow:0 6px 22px #0000000a}.card:hover{border-color:#7c3aed}.name{font-size:22px;font-weight:700}.meta{margin-top:10px;color:#6b7280}.badge{display:inline-block;margin-top:18px;background:#f3e8ff;color:#6d28d9;padding:7px 10px;border-radius:999px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center}.link{color:#6d28d9;text-decoration:none}</style></head><body><div class="wrap"><div class="top"><div><h1>Проекты автодозвона</h1><div class="sub">Один сайт · независимые сотрудники, воронки и очереди</div></div><a class="link" href="/admin/departments">Настройка отделов</a></div><div id="grid" class="grid"></div></div><script>
(async()=>{const r=await fetch('/departments');const ds=await r.json();const g=document.getElementById('grid');g.innerHTML=ds.map(d=>`<a class="card" href="/project/${d.id}"><div class="name">${d.name}</div><div class="meta">Воронка Bitrix: ${d.deal_category_id}<br>Триггер: ${d.stage_trigger}<br>Сотрудников: ${d.manager_count||0}</div><span class="badge">Открыть проект</span></a>`).join('')||'<div>Сначала создайте отдел в «Настройка отделов».</div>'})();
</script></body></html>
